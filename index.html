<meta name="theme-color" content="#16294A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16294A; --paper:#FFFFFF; --bg:#EEF2F6; --line:#D3DBE5; --muted:#5B6B80;
  --cyan:#0B7A99; --cyan-soft:#DDF0F5; --paid:#1E7A4C; --paid-soft:#E0F2E8;
  --unpaid:#B3264F; --unpaid-soft:#F9E3EA; --amber:#A86A00; --text:#16294A; --surface:#FFFFFF;
  --nav:#16294A; --navtext:#C9D5E6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1724; --surface:#18233A; --text:#E6ECF5; --line:#2B3A55; --muted:#97A6BC;
    --cyan:#4CC0DE; --cyan-soft:#16384A; --paid:#58C98E; --paid-soft:#173A2A; --unpaid:#F07C9E; --unpaid-soft:#47202E;
    --nav:#0A111C; --navtext:#9FB0C8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1724; --surface:#18233A; --text:#E6ECF5; --line:#2B3A55; --muted:#97A6BC;
  --cyan:#4CC0DE; --cyan-soft:#16384A; --paid:#58C98E; --paid-soft:#173A2A; --unpaid:#F07C9E; --unpaid-soft:#47202E;
  --nav:#0A111C; --navtext:#9FB0C8; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.15;margin:0 0 .5rem}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}

/* Structure */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--nav);color:var(--navtext);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:.25rem}
.brand{color:#fff;padding:.2rem .6rem 1.2rem}
.brand b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.35rem;line-height:1.1}
.brand span{font-size:.85rem;opacity:.75}
.navbtn{display:flex;align-items:center;gap:.7rem;width:100%;border:0;background:none;color:inherit;padding:.65rem .7rem;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.navbtn svg{width:20px;height:20px;flex-shrink:0}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn.on{background:#fff;color:#16294A}
.navbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.main{flex:1;min-width:0;padding:1.6rem 2rem 3rem;max-width:1100px}
.sync{margin-top:auto;font-size:.8rem;padding:.6rem;opacity:.8}
.topbar{display:none}
.tabbar{display:none}

@media (max-width:820px){
  .side{display:none}
  .main{padding:1rem 1rem calc(90px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:#fff;padding:.7rem 1rem}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--nav)}
  .topbar b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem}
  .topbar button{background:none;border:0;color:#fff;padding:.3rem;cursor:pointer}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--nav);padding:.35rem .2rem calc(.35rem + env(safe-area-inset-bottom,0px))}
  .tabbar .navbtn{flex-direction:column;gap:.15rem;font-size:.72rem;padding:.4rem .1rem;text-align:center;justify-content:center;color:var(--navtext)}
  .tabbar .navbtn.on{background:none;color:#fff}

}

/* Éléments */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1rem}

textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);padding:.6rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;min-height:44px;white-space:nowrap}

.btn.sm{padding:.35rem .65rem;min-height:36px;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:.75rem;margin-bottom:1rem}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.tag{display:inline-block;padding:.1rem .5rem;border-radius:5px;font-size:.78rem;font-weight:700}

/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem;margin-bottom:1rem}

.kpi.paid{border-left-color:var(--paid)} .kpi.unpaid{border-left-color:var(--unpaid)} .kpi.amber{border-left-color:var(--amber)}

/* Lignes de facture */
.lines .ln{display:grid;grid-template-columns:2.4fr .7fr 1fr 1fr 1fr 40px;gap:.45rem;align-items:center;margin-bottom:.45rem}

<script>
/* ============ Icônes et navigation ============ */
const IC = {
  menu:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  fac:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/>',
  reg:'<path d="M4 4h16v16H4zM4 9h16M4 14h16M9 4v16"/>',
  chg:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  pdg:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
  rap:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  par:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const NAV = [['menu','Menu principal','menu'],['home','Accueil','home'],['facture','Facture','fac'],['registre','Registre','reg'],['charges','Charges','chg'],['employes','Employés','emp'],['paie','Paie','pay'],['pdg','PDG','pdg'],['rapports','Rapports','rap'],['param','Paramètres','par']];
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
let view = 'menu';
const VERSION_APP='2.0.30';
/* Créateur du logiciel : coordonnées fixes, intégrées au code (identiques dans chaque installation, non modifiables) */
const CREATEUR={nom:'ALI DAÏM',email:'daim3575@gmail.com',tels:['+269 323 05 70','+269 432 29 14']};
const waLien=t=>'https://wa.me/'+t.replace(/\D/g,'');
const createurLiens=()=>`<a href="mailto:${CREATEUR.email}" target="_blank" rel="noopener">${CREATEUR.email}</a> · ${CREATEUR.tels.map(t=>`<a href="${waLien(t)}" target="_blank" rel="noopener">${t}</a>`).join(' / ')} (WhatsApp)`;
function createurCard(){
  return `<div class="card nocx" style="border-left:5px solid var(--cyan)"><h2>Créateur du logiciel</h2>
    <p style="margin:0 0 .4rem"><b style="font-size:1.1rem">${CREATEUR.nom}</b></p>
    <div class="scroll"><table><tbody>
      <tr><td style="width:150px">E-mail</td><td><a href="mailto:${CREATEUR.email}" target="_blank" rel="noopener">${CREATEUR.email}</a></td></tr>
      ${CREATEUR.tels.map(t=>`<tr><td>Téléphone / WhatsApp</td><td><a href="tel:${t.replace(/\s/g,'')}">${t}</a> <a class="btn sm" style="margin-left:.4rem" href="${waLien(t)}" target="_blank" rel="noopener">Écrire sur WhatsApp</a></td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="margin-bottom:0">Pour toute aide, panne, mot de passe oublié ou mise à jour du logiciel « Gestion de données SNI Express » (version ${VERSION_APP}).</p></div>`;
}
function drawNav(){
  document.body.classList.toggle('locked',LOCKED);
  const NV=NAV.filter(([k])=>autorise(k)), tb=document.querySelector('.topbar button'); if(tb) tb.style.display=(isAdmin()&&!LOCKED)?'':'none';
  document.getElementById('side').innerHTML = `<div class="brand"><img src="${IMG.logo||LOGO_SNI}" alt="" style="width:100%;border-radius:8px;margin-bottom:.6rem;display:block"><b>${h(S.nom)}</b><span>Gestion de données SNI Express</span></div>` +
    NV.map(([k,l,i])=>`<button class="navbtn ${view===k?'on':''}" onclick="go('${k}')">${svg(i)}${l}</button>`).join('') +
    `<div class="sync">${USER&&!S.connexionOff?`<div class="who"><span>Session ouverte</span><button class="btn sm" onclick="deconnexion()">Se déconnecter</button></div>`:''}${MODE==='db'?'Données synchronisées sur tous vos appareils':'Données enregistrées sur cet appareil uniquement'}</div>`;
  document.getElementById('tabbar').innerHTML = NV.map(([k,l,i])=>`<button class="navbtn ${view===k?'on':''}" onclick="go('${k}')">${svg(i)}${l}</button>`).join('')+(USER?`<button class="navbtn" onclick="deconnexion()">${svg('out')}Quitter</button>`:'');
  document.getElementById('tbName').textContent = S.nom;
}
function go(v){ if(LOCKED) return; if(!autorise(v)) v='facture'; view=v; if(v==='facture' && !draft) newDraft(); drawNav(); render(); window.scrollTo(0,0); signalerAppareil(); }

/* ============ Outils ============ */
const h = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => { const x = Number(String(v).replace(',','.')); return isFinite(x)?x:0; };
const fmt = v => Math.round(n0(v)).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');
const money = v => fmt(v)+' KMF';
const TAUX_EUR = 491.96775; // parité fixe : 1 € = 491,96775 KMF
const eur = v => (n0(v)/TAUX_EUR).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\u202f|\u00a0/g,' ')+' €';
const pad = (n,l=2)=>String(n).padStart(l,'0');
const dt = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} à ${pad(d.getHours())}h${pad(d.getMinutes())}`; };
const dOnly = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };

/* Montant en lettres (français) */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const T=['','','vingt','trente','quarante','cinquante','soixante'];
function b100(n,fin){
  if(n<17) return U[n];
  if(n<20) return 'dix-'+U[n-10];
  if(n<70){ const t=Math.floor(n/10),u=n%10; return u===0?T[t]:(u===1?T[t]+' et un':T[t]+'-'+U[u]); }
  if(n<80) return n===71?'soixante et onze':'soixante-'+b100(n-60,fin);
  if(n===80) return fin?'quatre-vingts':'quatre-vingt';
  return 'quatre-vingt-'+b100(n-80,fin);
}
function b1000(n,fin){
  const c=Math.floor(n/100), r=n%100; let s='';
  if(c===1) s='cent'; else if(c>1) s=U[c]+' cent'+(r===0&&fin?'s':'');
  if(r) s=(s?s+' ':'')+b100(r,fin);
  return s;
}
function enLettres(v){
  let n=Math.round(Math.abs(n0(v))); if(n===0) return 'Zéro franc comorien';
  const parts=[]; const md=Math.floor(n/1e9); n%=1e9; const mi=Math.floor(n/1e6); n%=1e6; const k=Math.floor(n/1000); const r=n%1000;
  if(md) parts.push(b1000(md,true)+' milliard'+(md>1?'s':''));
  if(mi) parts.push(b1000(mi,true)+' million'+(mi>1?'s':''));
  if(k) parts.push(k===1?'mille':b1000(k,false)+' mille');
  if(r) parts.push(b1000(r,true));
  const s=parts.join(' '); const tot=Math.round(Math.abs(n0(v)));
  return s.charAt(0).toUpperCase()+s.slice(1)+(tot>1?(tot%1e6===0?' de':'')+' francs comoriens':' franc comorien');
}

/* ============ Synchronisation en ligne (Firebase) : les mêmes données sur PC, téléphone et navigateur ============ */
const FB_CONFIG=null; // synchronisation en ligne désactivée : chaque appareil garde ses propres données
const FB_SDK='https://www.gstatic.com/firebasejs/10.12.2/';
let FB=null, DEMARRE=false;
async function initFirebase(){
  try{
    await loadLib(FB_SDK+'firebase-app-compat.js',()=>window.firebase);
    await loadLib(FB_SDK+'firebase-auth-compat.js',()=>window.firebase&&firebase.auth);
    await loadLib(FB_SDK+'firebase-firestore-compat.js',()=>window.firebase&&firebase.firestore);
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    const auth=firebase.auth();
    let user=await new Promise(r=>{ const stop=auth.onAuthStateChanged(x=>{ stop(); r(x); }); });
    if(!user) user=await ecranSync(auth);
    if(!user) return false;
    const db=firebase.firestore(); try{ db.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true}); }catch(e){}
    FB={auth,user}; await chargerDB(db,'commun');
    verifierMajEnLigne().then(i=>{ if(i&&majDispo()&&LOCKED&&DEMARRE) render(); });
    await envoyerLocal(true);
    ecouterSync(); demarrerAppareils();
    return true;
  }catch(e){ console.warn('Synchronisation indisponible',e); toast('Synchronisation indisponible : données de cet appareil seulement'); FB=null; MODE='local'; return false; }
}
/* Connexion de l'appareil au compte de synchronisation (une seule fois par appareil) */
function ecranSync(auth){
  return new Promise(res=>{
    document.body.classList.add('locked');
    const m=document.getElementById('main');
    m.innerHTML=`<div class="card login"><img src="${LOGO_SNI}" alt="Logo"><h1 style="margin:.2rem 0">Synchronisation des données</h1>
      <p class="muted">Pour voir les mêmes données sur le PC et le téléphone, connectez cet appareil au compte de synchronisation de l’entreprise. Cela se fait une seule fois par appareil.</p>
      <label class="f" style="text-align:left">E-mail du compte de synchronisation<input id="sy_e" type="email" autocomplete="username" autocapitalize="none"></label>
      <label class="f" style="margin-top:.7rem;text-align:left">Mot de passe de synchronisation<input id="sy_p" type="password" autocomplete="current-password"></label>
      <button class="btn pri" id="sy_ok" style="margin-top:1rem;width:100%">Connecter cet appareil</button>
      <p style="margin:1rem 0 0;text-align:center"><a href="#" id="sy_local" style="color:var(--muted)">Continuer sans synchronisation (données de cet appareil seulement)</a></p></div>`;
    const ok=async()=>{ const e=document.getElementById('sy_e').value.trim(), p=document.getElementById('sy_p').value, b=document.getElementById('sy_ok');
      if(!e||!p){ toast('Tapez l’e-mail et le mot de passe de synchronisation'); return; }
      b.disabled=true; b.textContent='Connexion…';
      try{ const c=await auth.signInWithEmailAndPassword(e,p); res(c.user); }
      catch(err){ b.disabled=false; b.textContent='Connecter cet appareil'; toast(/invalid|wrong|not-found|credential/i.test(err.code||'')?'E-mail ou mot de passe de synchronisation incorrect':/too-many/i.test(err.code||'')?'Trop d’essais, patientez quelques minutes':'Connexion impossible : '+(err.code||err.message)); } };
    document.getElementById('sy_ok').onclick=ok; document.getElementById('sy_p').onkeydown=ev=>{ if(ev.key==='Enter') ok(); };
    document.getElementById('sy_local').onclick=ev=>{ ev.preventDefault(); res(null); };
  });
}
/* Premier appareil : envoie en ligne les données déjà enregistrées sur cet appareil */
async function envoyerLocal(auto){
  const L={factures:LS.get('factures',[]),charges:LS.get('charges',[]),employes:LS.get('employes',[]),pdg:LS.get('pdg',[])};
  const n=Object.values(L).reduce((s,a)=>s+a.length,0);
  if(!n){ if(!auto) toast('Aucune donnée enregistrée sur cet appareil'); return; }
  if(auto&&(FAC.length||CHG.length||EMP.length||PDG.length)) return;
  if(auto&&LS.get('envoye',false)) return;
  if(!confirm(`Cet appareil contient ${L.factures.length} facture(s), ${L.charges.length} charge(s), ${L.employes.length} employé(s) et ${L.pdg.length} transaction(s) du PDG.\n\nLes envoyer dans la synchronisation pour les retrouver sur tous vos appareils ?\n(Les éléments identiques déjà en ligne sont remplacés, les autres conservés.)`)) { if(auto) LS.set('envoye',true); return; }
  toast('Envoi des données en cours…');
  for(const k of Object.keys(L)) await putMany(k,L[k]);
  const ls=LS.get('settings',{}), li=LS.get('images',{});
  if(!COMPTES().length&&Array.isArray(ls.comptes)&&ls.comptes.length) S.comptes=ls.comptes;
  Object.keys(ls).forEach(k=>{ if(S[k]==null||S[k]==='') S[k]=ls[k]; });
  Object.keys(li).forEach(k=>{ if(li[k]&&(!IMG[k]||IMG[k]===LOGO_SNI)) IMG[k]=li[k]; });
  await saveSettings(); LS.set('envoye',true);
  toast(n+' élément(s) envoyés dans la synchronisation');
}
/* Mises à jour en direct : ce qui est enregistré sur un appareil apparaît sur les autres */
function ecouterSync(){
  const set={factures:a=>FAC=a,charges:a=>CHG=a,employes:a=>EMP=a,pdg:a=>PDG=a};
  Object.keys(set).forEach(k=>BASE.collection(k).onSnapshot(s=>{ if(s.metadata.hasPendingWrites) return; set[k](s.docs.map(d=>({...d.data()}))); rafraichirSync(); },e=>console.warn(e)));
  BASE.onSnapshot(s=>{ if(s.exists&&!s.metadata.hasPendingWrites){ Object.assign(S,s.data()); rafraichirSync(); } },e=>console.warn(e));
  DB.doc('data/users/'+UIDV+'/images').onSnapshot(s=>{ if(s.exists&&!s.metadata.hasPendingWrites){ Object.assign(IMG,s.data()); rafraichirSync(); } },e=>console.warn(e));
}
let syncT=null;
function rafraichirSync(){
  if(!DEMARRE||LOCKED) return;
  clearTimeout(syncT); syncT=setTimeout(()=>{
    const a=document.activeElement, saisie=view==='facture'||view==='employes'||document.querySelector('.modal')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));
    if(saisie) return; // ne pas effacer une saisie en cours : les nouvelles données s'affichent à la prochaine page
    const y=window.scrollY; drawNav(); render(); window.scrollTo(0,y);
  },400);
}

/* ============ Suivi à distance des appareils connectés (PC et téléphones, même Wi-Fi ou données mobiles) ============ */
const APP_ID=(()=>{ try{ let i=localStorage.getItem('sni_appareil'); if(!i){ i='ap-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('sni_appareil',i); } return i; }catch(e){ return 'ap-inconnu'; } })();
const OUVERT_LE=new Date().toISOString();
let APPAREILS=[], apT=0;
function typeAppareil(){ const u=navigator.userAgent;
  if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()) return 'Téléphone Android (application)';
  if(window.sniDesk) return 'PC Windows (logiciel)';
  if(/Android/i.test(u)) return 'Téléphone Android (navigateur)'; if(/iPhone|iPad/i.test(u)) return 'iPhone / iPad (navigateur)';
  if(/Windows/i.test(u)) return 'PC Windows (navigateur)'; if(/Mac OS/i.test(u)) return 'Mac (navigateur)'; return 'Navigateur'; }
const nomAppareil=()=>{ try{ return localStorage.getItem('sni_appareil_nom')||''; }catch(e){ return ''; } };
const apDoc=id=>BASE.collection('appareils').doc(id);
async function signalerAppareil(force){
  if(!FB||!BASE) return; const now=Date.now(); if(!force&&now-apT<15000) return; apT=now;
  const page=LOCKED?'Page de connexion':((NAV.find(n=>n[0]===view)||[])[1]||view);
  try{ await apDoc(APP_ID).set({id:APP_ID,nom:nomAppareil()||typeAppareil(),type:typeAppareil(),utilisateur:(USER&&!LOCKED)?USER.nom:'',role:(USER&&!LOCKED)?USER.role:'',
    page,version:VERSION_APP,vu:new Date().toISOString(),vuServeur:firebase.firestore.FieldValue.serverTimestamp(),ouvert:OUVERT_LE,enLigne:true},{merge:true}); }catch(e){}
}
function demarrerAppareils(){
  signalerAppareil(true);
  setInterval(()=>{ signalerAppareil(true); if(view==='param') rafraichirSync(); },60000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') signalerAppareil(true); });
  window.addEventListener('pagehide',()=>{ try{ apDoc(APP_ID).set({enLigne:false,vu:new Date().toISOString()},{merge:true}); }catch(e){} });
  apDoc(APP_ID).onSnapshot(s=>{ const d=s.data(); if(d&&d.ordre==='deconnexion'){ s.ref.set({ordre:firebase.firestore.FieldValue.delete()},{merge:true});
    if(USER&&!LOCKED){ journal('Déconnexion à distance par un administrateur'); deconnexion(); toast('Cet appareil a été déconnecté à distance par l’administrateur'); } } },()=>{});
  BASE.collection('appareils').onSnapshot(s=>{ APPAREILS=s.docs.map(d=>({...d.data()})); if(view==='param') rafraichirSync(); },()=>{});
}
const apVu=a=>(a.vuServeur&&a.vuServeur.toMillis?a.vuServeur.toMillis():0)||Date.parse(a.vu)||0;
const apEnLigne=a=>a.enLigne!==false&&Date.now()-apVu(a)<150000;
const ilYa=t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?'à l’instant':m<60?'il y a '+m+' min':m<1440?'il y a '+Math.round(m/60)+' h':'le '+dt(new Date(t).toISOString()); };
function appareilsCard(){
  if(!isAdmin()||!FB_CONFIG) return '';

    ${L.map(a=>{ const moi=a.id===APP_ID, on=apEnLigne(a); return `<tr><td><b>${h(a.nom||a.type)}</b>${moi?' <span class="muted">(cet appareil)</span>':''}<br><small class="muted">${h(a.type||'')}</small></td>
      <td>${a.utilisateur?h(a.utilisateur)+'<br><small class="muted">'+h(roleCourt(a.role))+'</small>':'<span class="muted">Personne</span>'}</td><td>${h(a.page||'—')}</td><td>${h(a.version||'—')}</td><td>${ilYa(apVu(a))}</td>
      <td>${on?'<span class="tag paid">En ligne</span>':'<span class="tag unpaid">Hors ligne</span>'}</td>

    </tbody></table></div>`:'<div class="empty">Aucun appareil pour le moment.</div>'}</div>`;

async function deconnecterDistance(id){

  try{ await apDoc(id).set({ordre:'deconnexion'},{merge:true}); journal('Déconnexion à distance demandée : '+(a.nom||a.type)+(a.utilisateur?' ('+a.utilisateur+')':'')); toast('Déconnexion envoyée à l’appareil'); }catch(e){ toast('Échec de l’envoi'); }
}

let IMG = {logo:LOGO_SNI, cachet:'', signature:''};
let FAC=[], CHG=[], EMP=[], PDG=[];
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('sni_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('sni_'+k, JSON.stringify(v)); }catch(e){} }

async function chargerDB(db,id){
  DB=db; UIDV=id; BASE=db.doc('data/users/'+id+'/app');
  const [a,b,c,d,e,g] = await Promise.all([
    BASE.get(), BASE.collection('factures').get(), BASE.collection('charges').get(),
    BASE.collection('employes').get(), db.doc('data/users/'+id+'/images').get(), BASE.collection('pdg').get()
  ]);
  PDG = g.docs.map(x=>({...x.data()}));
  if(a.exists) S = Object.assign(S, a.data());
  FAC = b.docs.map(x=>({...x.data()}));
  CHG = c.docs.map(x=>({...x.data()}));
  EMP = d.docs.map(x=>({...x.data()}));
  if(e.exists) IMG = Object.assign(IMG, e.data()); if(!IMG.logo) IMG.logo=LOGO_SNI;
  MODE='db';
}
async function initStore(){
  if(FB_CONFIG && await initFirebase()) return;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if(db && id){ await chargerDB(db,id); return; }
    }
  }catch(err){ console.warn('Synchronisation indisponible', err); }
  MODE='local';
  S = Object.assign(S, LS.get('settings',{})); IMG = Object.assign(IMG, LS.get('images',{})); if(!IMG.logo) IMG.logo=LOGO_SNI;
  FAC = LS.get('factures',[]); CHG = LS.get('charges',[]); EMP = LS.get('employes',[]); PDG = LS.get('pdg',[]);
}
const LISTS = {factures:()=>FAC, charges:()=>CHG, employes:()=>EMP, pdg:()=>PDG};
async function put(coll,obj){
  if(coll==='factures' && obj.type==='D' && !obj.recu) obj.recu=nextRecuF(obj.date);
  const arr=LISTS[coll](); const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj);
  if(MODE==='db'){ try{ await BASE.collection(coll).doc(obj.id).set(obj); }catch(e){ toast("Échec de l'enregistrement : "+(e.message||e.code)); throw e; } }
  else LS.set(coll,arr);
}
async function del(coll,id){
  const arr=LISTS[coll](); const i=arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1);
  if(MODE==='db'){ try{ await BASE.collection(coll).doc(id).delete(); }catch(e){ toast('Échec de la suppression'); } }
  else LS.set(coll,arr);
}
async function saveSettings(){
  if(MODE==='db'){ await BASE.set(S); await DB.doc('data/users/'+UIDV+'/images').set(IMG); }
  else { LS.set('settings',S); LS.set('images',IMG); }
}

/* ============ Calculs ============ */
function calc(f){
  let brut=0, rem=0;
  (f.lignes||[]).forEach(l=>{ brut+=n0(l.qte)*n0(l.pu); rem+=n0(l.remise); });
  const ht=brut-rem, tva=Math.round(ht*n0(f.tva)/100), ttc=ht+tva;
  return {brut,rem,ht,tva,ttc};
}
function nextNum(type){
  const y=new Date().getFullYear(), pre=(type==='D'?'FD':'PF')+'-'+y+'-';
  let max=0; FAC.forEach(f=>{ if(f.num && f.num.startsWith(pre)){ const k=parseInt(f.num.slice(pre.length),10); if(k>max) max=k; } });
  return pre+pad(max+1,4);
}
const isPaid = f => f.type==='D';
function inPeriod(iso, period){ return period.length===4 ? locD(iso).slice(0,4)===period : ym(iso)===period; }
function stats(period){
  const fs=FAC.filter(f=>inPeriod(f.date,period));
  const D=fs.filter(f=>f.type==='D'), P=fs.filter(f=>f.type==='P');
  const Pwait=P.filter(f=>!f.convertie);
  const sum=(a,k)=>a.reduce((s,f)=>s+calc(f)[k],0);
  const cs=CHG.filter(c=>inPeriod(c.date,period));
  const ch={electricite:0,salaire:0,autre:0,variable:0}; cs.forEach(c=>{ ch[c.type]=(ch[c.type]||0)+n0(c.montant); });
  const fixes=ch.electricite+ch.salaire+ch.autre, variables=ch.variable, totCh=fixes+variables;
  const ht=sum(D,'ht'), tva=sum(D,'tva'), ttc=sum(D,'ttc'), rem=sum(D,'rem');
  const clients={}; D.forEach(f=>{ clients[f.client]=(clients[f.client]||0)+calc(f).ttc; });
  return {fs,D,P,Pwait,ht,tva,ttc,rem,attente:sum(Pwait,'ttc'),ch,fixes,variables,totCh,res:ht-totCh,cs,
    top:Object.entries(clients).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}

  try{ outilsCartes(); }catch(e){}
}

/* ============ Tarifs des impressions : la mesure saisie donne le prix unitaire automatiquement ============ */
const MODES_TARIF={m2:'au m² (largeur × hauteur)',ml:'au mètre linéaire (longueur)',unite:'à la pièce (prix fixe)'};
const TARIFS=()=>Array.isArray(S.tarifs)?S.tarifs:[];
const tarifsActifs=()=>TARIFS().filter(t=>String(t.nom||'').trim()&&n0(t.prix)>0);
const tarifDe=l=>l&&l.tarif?TARIFS().find(t=>t.id===l.tarif):null;
const fmtM=v=>String(Math.round(n0(v)*100)/100).replace('.',',');
/* Une mesure « 1*1 » dans la désignation se calcule toujours au m², quel que soit le réglage du tarif */
const modeL=(l,t)=>n0(l.lg)>0&&n0(l.ht)>0?'m2':t.mode;
const mesureTxt=(l,t)=>modeL(l,t)==='m2'?`${fmtM(l.lg)} m × ${fmtM(l.ht)} m (${fmtM(n0(l.lg)*n0(l.ht))} m²)`:modeL(l,t)==='ml'?`${fmtM(l.lg)} m`:'';
function appliquerTarif(l){
  const t=tarifDe(l); if(!t) return; const md=modeL(l,t);
  const q=md==='m2'?n0(l.lg)*n0(l.ht):md==='ml'?n0(l.lg):1;
  l.pu=q>0?Math.round(n0(t.prix)*q):'';
  if(l.dAuto!==false){ l.d=t.nom+(md==='unite'||q<=0?'':' – '+mesureTxt(l,t)); l.dAuto=true; }
}
const ligneOut=l=>({d:l.d,qte:n0(l.qte),pu:n0(l.pu),remise:n0(l.remise),...(l.tarif?{tarif:l.tarif,lg:n0(l.lg),ht:n0(l.ht)}:{})});
/* La désignation donne le tarif et la mesure : « Impression Autocollant 1.50*0.50 » → tarif Autocollant, 1,50 m × 0,50 m */
function lireMesure(d){
  const s=String(d||'');
  const m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:\*|x|X|×)\s*(\d+(?:[.,]\d+)?)/);
  if(m) return {lg:n0(m[1]),ht:n0(m[2])};
  const u=s.match(/(\d+(?:[.,]\d+)?)\s*(?:m|ml|mètres?|metres?)(?![a-zà-ÿ])/i);
  return u?{lg:n0(u[1])}:{};
}
const motsD=s=>' '+normT(s).replace(/[^a-z0-9]+/g,' ').replace(/([a-z])\1+/g,'$1').trim()+' ';
function trouverTarif(d){
  const t=motsD(d); let best=null;
  for(const x of tarifsActifs()){
    const n=motsD(x.nom).trim(); if(!n) continue;
    const mots=n.split(' ').filter(w=>w.length>1||/\d/.test(w));
    const a=w=>t.includes(' '+w+' ')||t.includes(' '+w+'s ')||t.includes(' '+w+'x ');
    if((t.includes(' '+n+' ')||(mots.length&&mots.every(a)))&&(!best||n.length>best.n.length)) best={x,n};
  }
  return best&&best.x;
}
function majDesignation(i,v){
  const l=draft.lignes[i]; l.d=v; l.dAuto=false;
  const t=trouverTarif(v);
  if(t){ const m=lireMesure(v); l.tarif=t.id; l.lg=m.lg??''; l.ht=m.ht??''; appliquerTarif(l); l.puAuto=true; }
  else if(l.tarif||l.puAuto){ delete l.tarif; delete l.lg; delete l.ht; if(l.puAuto) l.pu=''; l.puAuto=false; }
  const pu=document.getElementById('pu'+i); if(pu){ pu.value=l.pu; pu.readOnly=!!t; pu.style.background=t?'var(--cyan-soft)':''; }
  const ti=document.getElementById('ti'+i); if(ti) ti.innerHTML=infoTarif(l);
  upd(i);
}
function infoTarif(l){
  const t=tarifDe(l); if(!t) return tarifsActifs().length&&String(l.d||'').trim()?'<span class="muted">Aucun tarif reconnu dans la désignation : saisissez le prix unitaire.</span>':'';
  const p=money(t.prix), x=`<b>${h(t.nom)}</b>`, md=modeL(l,t);
  if(md==='m2') return n0(l.lg)>0&&n0(l.ht)>0?`✅ ${x} : ${fmtM(l.lg)} × ${fmtM(l.ht)} = ${fmtM(n0(l.lg)*n0(l.ht))} m² × ${p} = <b>${money(l.pu)}</b>`:`<span style="color:var(--unpaid)">${x} reconnu : ajoutez la mesure, ex. « Impression ${h(t.nom)} 0.00*0.00 »</span>`;
  if(md==='ml') return n0(l.lg)>0?`✅ ${x} : ${fmtM(l.lg)} m × ${p} = <b>${money(l.pu)}</b>`:`<span style="color:var(--unpaid)">${x} reconnu : ajoutez la longueur, ex. « ${h(t.nom)} 12.5 m »</span>`;
  return `✅ ${x} : ${p} la pièce`+(/\ba[0-6]\b/i.test(t.nom)?'':` <span class="muted">(ajoutez la mesure, ex. « Impression ${h(t.nom)} 1*1 », pour calculer au m²)</span>`);
}
function drawLines(){
  const el=document.getElementById('lns'); if(!el) return;
  const TA=tarifsActifs();
  el.innerHTML=(TA.length?''
    :`<p class="muted" style="margin:0 0 .6rem">${isAdmin()?'Aucun tarif avec un prix : ajoutez vos tarifs dans <a href="#" onclick="ouvrirTarifs();return false">Paramètres › Tarifs des impressions</a> pour que le prix unitaire se calcule tout seul à partir de la désignation.':'Aucun tarif n’est encore défini : saisissez le prix unitaire à la main.'}</p>`)+

    <div class="ln">
    <input class="d" id="d${i}" aria-label="Désignation" placeholder="Ex. : Impression Autocollant 0.00*0.00" title="Écrivez l’élément puis la mesure en mètres (longueur*hauteur), ex. Impression Autocollant 1.50*0.50 : le prix unitaire se calcule tout seul" value="${h(l.d)}" oninput="majDesignation(${i},this.value)">

    <input id="pu${i}" aria-label="Prix unitaire" placeholder="Prix unitaire" type="number" inputmode="numeric" min="0" value="${h(l.pu)}" ${t?'readonly style="background:var(--cyan-soft)"':''} oninput="draft.lignes[${i}].pu=this.value;draft.lignes[${i}].puAuto=false;upd(${i})">
    <input aria-label="Remise" placeholder="Remise" type="number" inputmode="numeric" min="0" value="${h(l.remise)}" oninput="draft.lignes[${i}].remise=this.value;upd(${i})">
    <span class="amt num" id="a${i}">${money(n0(l.qte)*n0(l.pu)-n0(l.remise))}</span>
    <button class="x" aria-label="Supprimer la ligne" onclick="draft.lignes.splice(${i},1);if(!draft.lignes.length)draft.lignes.push({d:'',qte:1,pu:'',remise:''});drawLines()">×</button></div>
    <div class="ln-i" id="ti${i}">${infoTarif(l)}</div></div>`; }).join('');
  drawTotals();
}

    <div class="btns" style="margin-top:.8rem"><button class="btn ${L.length?'':'pri'}" onclick="ajouterTarif()">+ Ajouter un tarif</button>${L.length?'<button class="btn pri" onclick="enregistrerTarifs()">Enregistrer les tarifs</button>':''}</div></div>`;

function lireTarifs(){ S.tarifs=TARIFS().map((t,i)=>({...t,nom:val('tf_n'+i).trim()||t.nom||'',mode:val('tf_m'+i)||t.mode||'m2',prix:val('tf_p'+i)===''?'':n0(val('tf_p'+i))})); }
function ajouterTarif(){ lireTarifs(); S.tarifs=[...TARIFS(),{id:uid(),nom:'',mode:'m2',prix:''}]; render(); const i=TARIFS().length-1; setTimeout(()=>{ const x=document.getElementById('tf_n'+i); if(x){ x.scrollIntoView({block:'center'}); x.focus(); } },50); }
function supprTarif(i){ lireTarifs(); const t=TARIFS()[i]; if(!confirm('Supprimer le tarif « '+(t&&t.nom||'sans nom')+' » ?')) return; S.tarifs=TARIFS().filter((x,k)=>k!==i); render(); toast('Tarif retiré : cliquez sur « Enregistrer les tarifs » pour confirmer'); }
async function enregistrerTarifs(){
  lireTarifs(); const L=TARIFS().filter(t=>String(t.nom).trim()||n0(t.prix));
  if(L.some(t=>!String(t.nom).trim())){ toast('Chaque tarif doit avoir un type d’impression'); return; }

  S.tarifs=L; try{ await saveSettings(); journal('Tarifs des impressions enregistrés ('+L.length+')'); toast('Tarifs enregistrés : '+L.filter(t=>n0(t.prix)>0).length+' tarif(s) avec un prix'); }catch(e){ toast('Échec de l’enregistrement'); } render();
}

function upd(i){ const l=draft.lignes[i]; document.getElementById('a'+i).textContent=money(n0(l.qte)*n0(l.pu)-n0(l.remise)); drawTotals(); }

async function enregistrer(rester){
  const f=draft, errs=erreursFacture(f);
  if(errs.length){ liveFacture(); toast(errs.length+' point(s) à corriger avant d’enregistrer'); document.getElementById('errs').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  f.lignes=f.lignes.filter(l=>String(l.d).trim()||n0(l.pu));
  if(!editing){ f.num=nextNum(f.type); f.date=new Date().toISOString(); f.par=imprimeur()||''; }
  else if(!f.par) f.par=imprimeur()||'';
  f.tva=n0(f.tva); f.lignes=f.lignes.map(ligneOut);
  try{ await put('factures',JSON.parse(JSON.stringify(f))); }catch(e){ return; }
  clearBrouillon(); toast('Facture '+f.num+' enregistrée dans le registre');
  const id=f.id; editing=null; newDraft(); if(rester){ render(); window.scrollTo(0,0); return true; } view='registre'; drawNav(); render(); voir(id);
}

/* Vérification, aperçu en direct et enregistrement automatique */
function erreursFacture(f){
  const e=[];
  if(!String(f.client||'').trim()) e.push('Le nom du client est vide.');
  const ls=f.lignes.filter(l=>String(l.d).trim()||n0(l.pu));
  if(!ls.length) e.push('Ajoutez au moins une ligne avec une désignation et un prix.');
  f.lignes.forEach((l,i)=>{
    if(!(String(l.d).trim()||n0(l.pu))) return;
    const k='Ligne '+(i+1)+' : ';
    if(!String(l.d).trim()) e.push(k+'la désignation est vide.');
    if(n0(l.qte)<=0) e.push(k+'la quantité doit être supérieure à 0.');
    const tf=tarifDe(l), sansMesure=tf&&((modeL(l,tf)==='m2'&&(n0(l.lg)<=0||n0(l.ht)<=0))||(tf.mode==='ml'&&n0(l.lg)<=0));
    if(sansMesure) e.push(k+(tf.mode==='m2'?'ajoutez la mesure en mètres dans la désignation, ex. « Impression '+tf.nom+' 0.00*0.00 ».':'ajoutez la longueur en mètres dans la désignation, ex. « '+tf.nom+' 12.5 m ».'));
    else if(n0(l.pu)<=0) e.push(k+'le prix unitaire doit être supérieur à 0.');
    if(n0(l.remise)<0) e.push(k+'la remise ne peut pas être négative.');
    if(n0(l.remise)>n0(l.qte)*n0(l.pu)) e.push(k+'la remise dépasse le montant de la ligne.');
  });
  if(n0(f.tva)<0||n0(f.tva)>100) e.push('La TVA doit être comprise entre 0 et 100 %.');
  return e;
}
function liveFacture(){
  const ap=document.getElementById('apercu'), er=document.getElementById('errs'); if(!ap||!draft) return;
  const f=draft, errs=erreursFacture(f);
  er.innerHTML=errs.length?`<div class="errs"><b>À corriger avant d’enregistrer (${errs.length})</b><ul>${errs.map(x=>`<li>${h(x)}</li>`).join('')}</ul></div>`
    :'<div class="errs ok"><b>Tout est correct : la facture peut être enregistrée.</b></div>';
  const pv={...f,num:editing?f.num:nextNum(f.type),date:editing?f.date:new Date().toISOString(),tva:n0(f.tva),
    lignes:f.lignes.filter(l=>String(l.d).trim()||n0(l.pu)).map(ligneOut)};
  ap.innerHTML=sheetHTML(pv);

}

function decorerSheet(sh){

const NATIF=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform());
async function saveFileNatif(filename,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:'text/html'});
  const b64=await new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=ko; r.readAsDataURL(blob); });
  const {Filesystem,Share}=Capacitor.Plugins;
  const w=await Filesystem.writeFile({path:filename,data:b64,directory:'CACHE'});

async function saveFile(filename,data){
  if(NATIF){ try{ await saveFileNatif(filename,data); }catch(e){ if(!/cancel|annul/i.test(String(e&&e.message||e))) toast('Fichier non enregistré : '+String(e&&e.message||e).slice(0,100)); } return; }
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename,data}); return; }
  }catch(e){ if(e && e.code && e.code!=='unavailable'){ return; } }
  try{ const a=document.createElement('a'), u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/html'})); a.href=u; a.download=filename; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }
  catch(e){ toast('Téléchargement impossible sur cet appareil'); }

const XLSX_URL='lib/xlsx.full.min.js';

function loadLib(url,ok){
  if(ok()) return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=()=>rej(new Error('lib')); document.head.appendChild(s); });
}
async function exportPDF(html,filename,fmt){
  html=avecSignatures(html); const A6=fmt==='a6', PW=A6?105:210, PH=A6?148:297, PX=A6?397:794;
  toast('Préparation du PDF…');
  try{
    await loadLib('lib/html2canvas.min.js',()=>window.html2canvas);
    await loadLib('lib/jspdf.umd.min.js',()=>window.jspdf);
  }catch(e){ toast('Connexion nécessaire pour créer le PDF'); return; }
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:'+PX+'px;background:#fff';
  host.innerHTML=html; document.body.appendChild(host);
  try{
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:A6?'a6':'a4'});
    const sheets=[...host.querySelectorAll('.sheet')];
    for(let i=0;i<sheets.length;i++){
      sheets[i].style.minWidth='0'; sheets[i].style.width=PX+'px'; sheets[i].style.maxWidth=PX+'px';
      const c=await window.html2canvas(sheets[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});
      let w=PW, hh=c.height*PW/c.width;
      if(hh>PH){ w=w*PH/hh; hh=PH; }
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',(PW-w)/2,0,w,hh);
    }
    await saveFile(filename, pdf.output('blob'));
  }catch(e){ toast('Le PDF n’a pas pu être créé : utilisez « Imprimer / PDF »'); }
  host.remove();
}

/* Import d'un fichier Excel de suivi des opérations */
const MOISN={janvier:1,fevrier:2,mars:3,avril:4,mai:5,mais:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
const normT = s => String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const numX = v => { if(typeof v==='number') return isFinite(v)?v:0; const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:0; };
function classerCharge(t){
  if(/sonelec|sonolec|\beda\b|electri|courant/.test(t)) return 'electricite';
  if(/sal+aire|paiment des agents|paiement des agents|\bpaye\b/.test(t)) return 'salaire';
  if(/\bin[a-z]{2,6}t\b|loyer/.test(t)) return 'autre';
  return 'variable';
}
function motifAuto(t){
  if(/medic|pantopra|sante|hopital|pharma/.test(t)) return 'Santé';
  if(/maman|famil|houla|cadeau|mariage/.test(t)) return 'Dépense familiale';
  if(/taxi|carbur|gasoil|location|transport|course|voiture|moto/.test(t)) return 'Frais de transport';
  if(/achat/.test(t)) return 'Achat personnel';
  return 'Autre';
}
function analyserExcel(wb){
  const out={fac:[],chg:[],pdg:[],remb:[],mois:[]};
  wb.SheetNames.forEach(sn=>{
    const ns=normT(sn), ym=ns.match(/(\d{4})/); let M=0;
    Object.keys(MOISN).forEach(k=>{ if(new RegExp('\\b'+k+'\\b').test(ns)) M=MOISN[k]; });
    if(!M||!ym) return;
    const Y=+ym[1], rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const hi=rows.findIndex(r=>r&&normT(r[0]).startsWith('date')); if(hi<0) return;
    const H=rows[hi].map(normT), col=re=>H.findIndex(x=>re.test(x));
    const C={cl:col(/^client/),de:col(/signation/),q:col(/^qt/),pu:col(/^pu|prix/),mt:col(/^montant/),ou:col(/oukache|pdg/),rb:col(/rembours/),ch:col(/charge/)};
    const nbJ=new Date(Y,M,0).getDate(); let jour=1; const st={nom:sn,ventes:0,mtV:0,fixes:0,variables:0,emprunts:0,rembs:0};
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]||[]; if(normT(r[0]).startsWith('total')) break;
      const g=k=>C[k]>=0?r[C[k]]:null;
      const mt=numX(g('mt')), ou=numX(g('ou')), rb=numX(g('rb')), ch=numX(g('ch'));
      if(!(mt>0||ou>0||rb>0||ch>0)) continue;
      const d0=r[0];
      if(d0 instanceof Date) jour=new Date(d0.getTime()+12*3600e3).getDate();
      else if(typeof d0==='number') jour=new Date(Math.round((d0-25569)*864e5)+12*3600e3).getUTCDate();
      else { const m=String(d0||'').match(/(\d{1,2})\s*[\/.-]/); if(m) jour=+m[1]; }
      jour=Math.min(Math.max(jour,1),nbJ);
      const date=new Date(Y,M-1,jour,12).toISOString(), cl=String(g('cl')??'').trim(), de=String(g('de')??'').trim();
      const txt=normT(cl+' '+de), lib=[cl,de].filter(Boolean).join(' – '), key='xl|'+sn+'|'+(i+1);
      if(mt>0){ let q=numX(g('q'))||1, p=numX(g('pu'))||mt/q; if(Math.round(q*p)!==Math.round(mt)){ q=1; p=mt; }
        out.fac.push({imp:key,type:'D',date,client:cl||'Client',clientTel:'',objet:de,tva:0,lignes:[{d:de||'Impression',qte:q,pu:p,remise:0}]}); st.ventes++; st.mtV+=mt; }
      if(ou>0){ out.pdg.push({imp:key,type:'emprunt',date,montant:ou,motif:motifAuto(txt),note:lib,rembs:[]}); st.emprunts+=ou; }
      if(rb>0){ out.remb.push({imp:key,date,montant:rb,note:lib}); st.rembs+=rb; }
      if(ch>0){ const ty=classerCharge(txt); out.chg.push({imp:key,type:ty,date,montant:ch,note:lib}); if(ty==='variable') st.variables+=ch; else st.fixes+=ch; }
    }
    out.mois.push(st);
  });
  return out;
}

async function putMany(coll,list){
  if(!list.length) return; const arr=LISTS[coll]();
  list.forEach(o=>{ if(coll==='factures' && o.type==='D' && !o.recu) o.recu=nextRecuF(o.date); const i=arr.findIndex(x=>x.id===o.id); if(i>=0) arr[i]=o; else arr.push(o); });
  if(MODE==='db'){ for(let i=0;i<list.length;i+=10) await Promise.all(list.slice(i,i+10).map(o=>BASE.collection(coll).doc(o.id).set(o))); }
  else LS.set(coll,arr);
}
async function delMany(coll,ids){
  if(!ids.length) return; const arr=LISTS[coll](), set=new Set(ids);
  for(let i=arr.length-1;i>=0;i--) if(set.has(arr[i].id)) arr.splice(i,1);
  if(MODE==='db'){ for(let i=0;i<ids.length;i+=10) await Promise.all(ids.slice(i,i+10).map(id=>BASE.collection(coll).doc(id).delete())); }
  else LS.set(coll,arr);
}

async function importerExcel(input){

async function confirmerImport(){
  const {o,deja}=IMPX, b=document.getElementById('btnImp'); if(b){ b.disabled=true; b.textContent='Importation en cours…'; }
  const cpt={};
  const numF=(pre,date)=>{ const p=pre+'-'+date.slice(0,4)+'-';
    if(cpt[p]==null){ let mx=0; const all=pre==='FD'?FAC.map(f=>f.num):[...PDG.map(t=>t.num),...PDG.flatMap(t=>(t.rembs||[]).map(r=>r.num))];
      all.forEach(n=>{ if(n&&n.startsWith(p)) mx=Math.max(mx,parseInt(n.slice(p.length),10)||0); }); cpt[p]=mx; }
    return p+pad(++cpt[p],4); };
  const neuf=x=>!deja.has(x.imp);
  const fac=o.fac.filter(neuf).sort(byDate).map(f=>({...f,id:uid(),num:numF('FD',f.date)}));
  const chg=o.chg.filter(neuf).map(c=>({...c,id:uid()}));
  const pdgNew=o.pdg.filter(neuf).sort(byDate).map(t=>({...t,id:uid(),num:numF('REC',t.date)}));
  const debts=[...PDG.map(t=>({...t,rembs:[...(t.rembs||[])]})),...pdgNew].sort(byDate), touched=new Set(pdgNew.map(t=>t.id));
  let nonAff=0;
  o.remb.filter(neuf).sort(byDate).forEach(r=>{
    let reste=r.montant;
    for(const t of debts){ if(reste<=0) break; if(t.date>r.date) continue; const rt=resteP(t); if(rt<=0) continue;
      const m=Math.min(rt,reste); t.rembs.push({id:uid(),num:numF('RMB',r.date),date:r.date,montant:m,imp:r.imp}); reste-=m; touched.add(t.id); }
    nonAff+=reste;
  });
  try{
    await putMany('factures',fac); await putMany('charges',chg); await putMany('pdg',debts.filter(t=>touched.has(t.id)));
  }catch(e){ toast('Import interrompu : '+(e.message||'erreur')); return; }
  document.querySelectorAll('.modal').forEach(x=>x.remove());
  modalPdg(`<div class="head" style="margin-bottom:.6rem"><h2 style="margin:0">Import terminé</h2><button class="btn" onclick="this.closest('.modal').remove()">Fermer</button></div>
    <p>${fac.length} facture(s) payée(s) ajoutée(s) au registre, ${chg.length} charge(s) réparties en fixes et variables, ${pdgNew.length} emprunt(s) du PDG avec leur reçu.</p>
    ${nonAff>0?`<p class="muted">${money(nonAff)} de remboursements n’ont pas trouvé d’emprunt à rembourser à leur date ; ils n’ont pas été comptés.</p>`:''}
    <div class="btns"><button class="btn pri" onclick="this.closest('.modal').remove();go('registre')">Voir le registre</button><button class="btn" onclick="this.closest('.modal').remove();go('rapports')">Voir les rapports</button><button class="btn" onclick="this.closest('.modal').remove();go('pdg')">Voir la page PDG</button></div>`);
  render();
}
async function retirerImport(){
  const f=FAC.filter(x=>x.imp), c=CHG.filter(x=>x.imp), p=PDG.filter(x=>x.imp), pt=PDG.filter(t=>!t.imp&&(t.rembs||[]).some(r=>r.imp));
  if(!confirm('Retirer toutes les données importées depuis Excel ('+f.length+' factures, '+c.length+' charges, '+p.length+' emprunts) ? Les données saisies à la main sont conservées.')) return;
  if(!await confirmerAdmin('retirer les données importées')) return; journal('Données importées retirées');
  await delMany('factures',f.map(x=>x.id)); await delMany('charges',c.map(x=>x.id)); await delMany('pdg',p.map(x=>x.id));
  await putMany('pdg',pt.map(t=>({...t,rembs:t.rembs.filter(r=>!r.imp)})));
  toast('Données importées retirées'); render();
}

const nomPdg = () => 'Mr '+(S.responsable||'le PDG');
function lignesCompte(){
  const L=[];
  PDG.forEach(t=>{ L.push({date:t.date,des:(t.type==='reliquat'?'Reliquat':'Emprunt')+' – argent pris dans la caisse',num:t.num||'—',motif:motifP(t),deb:n0(t.montant),cre:0,k:'s',t,paid:resteP(t)<=0});
    (t.rembs||[]).forEach(r=>L.push({date:r.date,des:'Remboursement'+(t.num?' du reçu '+t.num:''),num:r.num||'—',motif:motifP(t),deb:0,cre:n0(r.montant),k:'r',t,r,paid:true})); });
  L.sort((a,b)=>a.date.localeCompare(b.date)||(a.k==='s'?-1:1));
  let s=0; L.forEach(x=>{ s+=x.deb-x.cre; x.solde=s; });
  return L;
}
function totCompte(L){ const d=L.reduce((s,x)=>s+x.deb,0), c=L.reduce((s,x)=>s+x.cre,0); return {d,c,s:d-c}; }

/* Paie et bulletins de paye (automatiques chaque mois) */
const ymNow = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
function nextYm(p){ let y=+p.slice(0,4), m=+p.slice(5)+1; if(m>12){ m=1; y++; } return y+'-'+pad(m); }
const actif = (e,p) => (e.debut||'0000-00')<=p && (!e.fin || p<=e.fin);
const moisTxt = p => MOIS[+p.slice(5)-1]+' '+p.slice(0,4);
const GAINS=[['salaire','Salaire de base'],['hsup','Heures supplémentaires'],['prime','Prime'],['rendement','Rendement'],['remplacement','Remplacement'],['anciennete','Ancienneté'],['logement','Logement']];
const RETS=[['retenue','Retenue sur salaire'],['avance','Avance'],['absret','Absences et retards'],['cotis','Cotisations salariales'],['autres','Autres retenues']];
const MONTANTS=[...GAINS,...RETS].map(x=>x[0]);
const QR_URL='lib/qrcode.min.js';
const lastDay = p => { const y=+p.slice(0,4), m=+p.slice(5); return p+'-'+pad(new Date(y,m,0).getDate()); };
/* Un salaire saisi pour le dernier mois devient le salaire des mois suivants */
function figerAvant(e,p){ let q=e.debut||e.depuis||p, g=0; e.mois={...(e.mois||{})}; while(q<p && g++<240){ if(actif(e,q)&&!e.mois[q]) e.mois[q]=bv(e,q); q=nextYm(q); } }
function baseDepuis(e,p,v){ if(Object.keys(e.mois||{}).some(k=>k>p)) return; const vv={...v}; figerAvant(e,p); e.mois[p]=vv; MONTANTS.forEach(k=>e[k]=n0(vv[k])); if(vv.modePaie) e.modePaie=vv.modePaie; }
function bv(e,p){
  const now=ymNow(), today=auj(), o={};
  MONTANTS.forEach(k=>o[k]=n0(e[k]));
  Object.assign(o,{present:26,absent:0,retards:0,modePaie:e.modePaie||'Espèces',taux:n0(e.taux),urgence:'',
    statut:'attente',datePaye:''});
  return Object.assign(o,(e.mois&&e.mois[p])||{});
}
const brutV = v => GAINS.reduce((s,[k])=>s+n0(v[k]),0);
const retV = v => RETS.reduce((s,[k])=>s+n0(v[k]),0);
const brutE = (e,p=ymNow()) => brutV(bv(e,p));
const netE = (e,p=ymNow()) => { const v=bv(e,p); return brutV(v)-retV(v); };
const coutE = (e,p=ymNow()) => { const v=bv(e,p), b=brutV(v); return Math.round(b+b*n0(v.taux)/100); };
const numE = e => e.num || pad([...EMP].sort((a,b)=>(a.embauche||'').localeCompare(b.embauche||'')).indexOf(e)+1,2);
let editEmp=null, pp=ymNow();
async function autoSalaires(){
  const now=ymNow();
  for(const e of EMP){
    let p=e.depuis||e.debut||now, guard=0;
    while(p<=now && guard++<120){
      if(actif(e,p)){
        const c=CHG.find(c=>c.type==='salaire'&&c.emp===e.id&&ym(c.date)===p), m=coutE(e,p);
        if(!c) await put('charges',{id:uid(),type:'salaire',emp:e.id,date:new Date(p+'-28T12:00:00').toISOString(),montant:m,note:'Salaire '+e.nom+' – '+moisTxt(p)});
        else if(n0(c.montant)!==m) await put('charges',{...c,montant:m});
      }
      p=nextYm(p);
    }
  }
}

/* Choix du mois et de l'année de paie */
function anneesPaie(){
  const now=+ymNow().slice(0,4); let min=Math.min(now-5,+pp.slice(0,4));
  EMP.forEach(e=>{ const d=parseInt(String(e.debut||e.depuis||e.embauche||'').slice(0,4),10); if(d&&d<min) min=d; });
  const L=[]; for(let y=Math.max(now+1,+pp.slice(0,4));y>=min;y--) L.push(y); return L;
}
const choixPeriode=()=>`<label class="f" style="flex:0 0 auto">Mois<select aria-label="Mois de paie" onchange="pp=pp.slice(0,5)+this.value;render()" style="width:auto">${MOIS.map((m,i)=>`<option value="${pad(i+1)}" ${+pp.slice(5)===i+1?'selected':''}>${m}</option>`).join('')}</select></label>

async function saveMois(id){
  const e={...EMP.find(x=>x.id===id)}, o={};
  [...MONTANTS,'present','absent','retards'].forEach(k=>o[k]=n0(val('mm_'+k)));
  ['datePaye','statut','modePaie','urgence'].forEach(k=>o[k]=val('mm_'+k));
  if(o.statut==='paye'&&!o.datePaye) o.datePaye=auj();
  if(retV(o)>brutV(o)){ toast('Les retenues dépassent le salaire brut'); return; }
  o.verse=n0(val('mm_verse'));
  if(o.statut==='partiel'&&o.verse<=0){ toast('Indiquez le montant déjà versé'); return; }
  if(o.statut==='partiel'&&o.verse>netV(o)){ toast('Le montant versé dépasse le net à payer'); return; }
  fixStatut(o);
  e.mois={...(e.mois||{}),[pp]:{...o,taux:bv(e,pp).taux}}; baseDepuis(e,pp,e.mois[pp]);
  try{ await put('employes',e); await autoSalaires(); }catch(err){ return; }
  document.querySelectorAll('.modal').forEach(x=>x.remove()); toast('Bulletin de '+moisTxt(pp)+' enregistré'); render(); voirBulletin(id);
}

function demander(msg,def,type){

    const md=document.createElement('div'); md.className='modal';
    md.innerHTML=`<div class="in" style="max-width:440px"><p style="margin-top:0;white-space:pre-line">${h(msg)}</p><input id="dm_in" type="${type||'text'}" ${type==='password'?'inputmode="numeric"':''} value="${h(def||'')}" style="width:100%"><div class="btns" style="margin-top:1rem;justify-content:flex-end"><button class="btn" id="dm_no">Annuler</button><button class="btn pri" id="dm_ok">Valider</button></div></div>`;
    const fin=v=>{ md.remove(); res(v); };
    document.body.appendChild(md); const i=md.querySelector('#dm_in'); i.focus(); i.select();
    md.querySelector('#dm_ok').onclick=()=>fin(i.value); md.querySelector('#dm_no').onclick=()=>fin(null);
    i.onkeydown=e=>{ if(e.key==='Enter') fin(i.value); if(e.key==='Escape') fin(null); };

}

const locD = s => { s=String(s||''); if(s.length<=10) return s; const d=new Date(s); return isNaN(d)?s.slice(0,10):d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const dFr = s => s? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '';
const decal = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
let rj={per:'auj', du:'', au:'', dev:'kmf', u:''};
const PERIODES=[['auj','Aujourd’hui'],['hier','Hier'],['7j','7 derniers jours'],['mois','Ce mois-ci'],['perso','Dates choisies']];
function rjDates(){
  if(rj.per==='auj'){ rj.du=rj.au=decal(0); }
  else if(rj.per==='hier'){ rj.du=rj.au=decal(-1); }
  else if(rj.per==='7j'){ rj.du=decal(-6); rj.au=decal(0); }
  else if(rj.per==='mois'){ rj.du=decal(0).slice(0,8)+'01'; rj.au=decal(0); }
  else { rj.du=rj.du||decal(0); rj.au=rj.au||rj.du; }
  if(rj.au<rj.du){ const t=rj.du; rj.du=rj.au; rj.au=t; }
}
function utilisateurs(){ return [...new Set([...COMPTES().map(c=>c.nom),...FAC.map(f=>f.par),...CHG.map(c=>c.par),S.responsable].map(x=>String(x||'').trim()).filter(Boolean))]; }

function moisAvecDonnees(){
  const now=ymNow(); let L=[...FAC.map(f=>ym(f.date)),...CHG.map(c=>ym(c.date))].filter(x=>x&&x<=now).sort();

}

function chargerImage(k,input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=async()=>{
      const max=360, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      IMG[k]=c.toDataURL('image/png');
      if(IMG[k].length>120000) IMG[k]=c.toDataURL('image/webp',0.85);
      try{ await saveSettings(); toast('Image enregistrée'); }catch(e){ toast('Image trop lourde, essayez une image plus petite'); }
      render(); };
    img.src=r.result; };
  r.readAsDataURL(file);
}
/* Mise à jour directe : installer une nouvelle version du logiciel depuis Paramètres, sans toucher aux données */
let MAJINFO=null;
const cmpVersion=(a,b)=>{ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
function majCard(){
  if(!isAdmin()) return '';
  const desk=DESK&&typeof DESK.majInstaller==='function';
  if(desk&&!MAJINFO){ DESK.majInfo().then(i=>{ MAJINFO=i||{}; if(view==='param') render(); }).catch(()=>{ MAJINFO={}; }); }
  return `<div class="card"><h2>Mise à jour du logiciel</h2>
    <p style="margin-top:0">Version installée : <b>${VERSION_APP}</b>${MAJINFO&&MAJINFO.actif?' <span class="tag conv">mise à jour installée</span>':''}</p>
    ${desk?`<p class="muted">Quand vous recevez une nouvelle version (fichier « Gestion de données SNI Express.html »), installez-la ici : le logiciel redémarre tout seul sur la nouvelle version. Vos données (factures, charges, employés, comptes…) sont conservées. Pensez à faire une sauvegarde complète avant.</p>
    <div class="btns"><label class="btn pri">Installer une mise à jour<input type="file" accept=".html,.htm,text/html" style="display:none" onchange="installerMaj(this)"></label>
      ${MAJINFO&&MAJINFO.actif?'<button class="btn" onclick="annulerMaj()">Revenir à la version d’origine</button>':''}</div>`
    :`<p class="muted" style="margin-bottom:0">Pour mettre à jour cette version navigateur, remplacez simplement ce fichier .html par la nouvelle version, au même endroit, puis rouvrez-le avec le même navigateur : vos données sont conservées. Dans le logiciel Windows, la mise à jour se fait directement depuis cette page.</p>`}
    <div class="btns" style="margin-top:.8rem"><button class="btn" onclick="ouvrirMaj(true)">Vérifier les mises à jour</button></div>
    ${FB?`<h3 style="margin:1.1rem 0 .4rem">Publier une version pour tous les appareils</h3>
      <p class="muted" style="margin-top:0">Choisissez le fichier de la nouvelle version (« Gestion de données SNI Express.html ») : à leur prochaine ouverture, tous les PC et téléphones verront « Nouvelle version disponible ».${MAJ_EN_LIGNE?' Version actuellement publiée : <b>'+h(MAJ_EN_LIGNE.version)+'</b> (le '+dt(MAJ_EN_LIGNE.date)+').':''}</p>
      <div class="btns"><label class="btn">Publier une version<input type="file" accept=".html,.htm,text/html" style="display:none" onchange="publierMaj(this)"></label></div>`:''}</div>`;
}
async function installerMaj(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  let html; try{ html=await file.text(); }catch(e){ toast('Fichier illisible'); return; }
  await installerHtml(html);
}
async function installerHtml(html){
  if(!(DESK&&typeof DESK.majInstaller==='function')){ toast('L’installation directe se fait dans le logiciel Windows'); return; }
  const m=String(html||'').match(/const VERSION_APP='([\d.]+)'/);
  if(!m||!html.includes('Gestion de données SNI Express')){ toast('Ce fichier n’est pas une mise à jour de Gestion SNI Express'); return; }
  const v=m[1], c=cmpVersion(v,VERSION_APP);
  if(!confirm(c>0?`Installer la version ${v} ? (version actuelle : ${VERSION_APP})\n\nLe logiciel va redémarrer. Vos données sont conservées.`:`Attention : la version ${v} n’est pas plus récente que la version actuelle (${VERSION_APP}).\n\nL’installer quand même ?`)) return;
  if(!await confirmerAdmin('installer la mise à jour '+v)) return;
  try{ journal('Mise à jour installée : version '+VERSION_APP+' → '+v); toast('Installation de la version '+v+'…'); await DESK.majInstaller(html); }
  catch(e){ toast('Échec de la mise à jour : '+String(e&&e.message||e).replace(/^Error invoking remote method '[^']+': (Error: )?/,'').slice(0,120)); }
}
async function annulerMaj(){
  if(!confirm('Revenir à la version d’origine du logiciel ? Vos données sont conservées.')) return;
  if(!await confirmerAdmin('revenir à la version d’origine')) return;
  journal('Mise à jour retirée : retour à la version d’origine'); try{ await DESK.majAnnuler(); }catch(e){ toast('Échec'); }
}
/* ============ Mise à jour en ligne : l'administrateur publie une version, chaque appareil la voit dès l'ouverture ============ */
let MAJ_EN_LIGNE=null;
const majDispo=()=>!!(MAJ_EN_LIGNE&&MAJ_EN_LIGNE.version&&cmpVersion(MAJ_EN_LIGNE.version,VERSION_APP)>0);
const estWindows=()=>!!(DESK&&typeof DESK.majInstaller==='function');
/* ============ Mise à jour automatique par GitHub : à l'ouverture, PC et téléphone prennent tout seuls la dernière version publiée ============ */
const MAJ_GH='https://raw.githubusercontent.com/Daim3712/sni-express-maj/main/';
async function majGitHubInfo(){
  if(!MAJ_GH) return null;
  try{ const r=await fetch(MAJ_GH+'version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; const i=await r.json(); return i&&i.version?{...i,gh:true}:null; }catch(e){ return null; }
}
async function majGitHubTexte(f){ const r=await fetch(MAJ_GH+f+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('fichier '+f+' introuvable en ligne'); return r.text(); }
async function majGitHubHtml(i){
  const html=await majGitHubTexte('index.html'), m=html.match(/const VERSION_APP='([\d.]+)'/);
  if(!m||m[1]!==i.version||!html.includes('Gestion de données SNI Express')) throw new Error('version en ligne incomplète');
  return html;
}
/* Téléphone : la nouvelle version est copiée dans l'application, qui redémarre dessus (données conservées) */
async function majTelephone(i){
  const {Filesystem,WebView}=Capacitor.Plugins, dir='maj/'+i.version;
  await Filesystem.writeFile({path:dir+'/index.html',data:await majGitHubHtml(i),directory:'DATA',encoding:'utf8',recursive:true});
  for(const x of i.lib||[]) await Filesystem.writeFile({path:dir+'/lib/'+x,data:await majGitHubTexte('lib/'+x),directory:'DATA',encoding:'utf8',recursive:true});
  const u=await Filesystem.getUri({path:dir,directory:'DATA'}), chemin=decodeURIComponent(u.uri.replace(/^file:\/\//,''));
  journal('Mise à jour automatique : version '+VERSION_APP+' → '+i.version);
  await WebView.setServerBasePath({path:chemin});
}
async function majAutoDemarrage(){
  /* La version téléchargée n'est gardée qu'une fois qu'elle a bien démarré ; les anciennes sont effacées */
  if(NATIF) try{ const {WebView,Filesystem}=Capacitor.Plugins, b=(await WebView.getServerBasePath()).path||'';    if(b.includes('/maj/')){ await WebView.persistServerBasePath(); const cur=b.split('/maj/')[1].split('/')[0];
      for(const x of (await Filesystem.readdir({path:'maj',directory:'DATA'})).files){ const n=x.name||x; if(n!==cur) await Filesystem.rmdir({path:'maj/'+n,directory:'DATA',recursive:true}); } } }catch(e){}
  const i=await majGitHubInfo(); if(!i) return; MAJ_EN_LIGNE=i;
  if(cmpVersion(i.version,VERSION_APP)<=0) return;
  try{
    if(NATIF){ toast('Mise à jour '+i.version+' en cours…'); await majTelephone(i); }
    else if(estWindows()){ toast('Mise à jour '+i.version+' en cours…'); const html=await majGitHubHtml(i); journal('Mise à jour automatique : version '+VERSION_APP+' → '+i.version); await DESK.majInstaller(html); }
    else if(LOCKED) render();
  }catch(e){ toast('Mise à jour automatique impossible : '+String(e&&e.message||e).slice(0,100)); }
}
async function verifierMajEnLigne(){
  if(!FB&&MAJ_GH){ MAJ_EN_LIGNE=await majGitHubInfo(); return MAJ_EN_LIGNE; }
  if(!FB||!BASE) return null;
  try{ const s=await BASE.collection('maj').doc('info').get(); MAJ_EN_LIGNE=s.exists?s.data():null; }catch(e){ MAJ_EN_LIGNE=null; }
  return MAJ_EN_LIGNE;
}
async function telechargerMajEnLigne(){
  const i=MAJ_EN_LIGNE; if(!i) return null; const parts=[];
  for(let k=0;k<i.parts;k++){ const s=await BASE.collection('maj').doc('p'+k).get(); if(!s.exists) throw new Error('Mise à jour incomplète en ligne'); parts.push(s.data().t); }
  return parts.join('');
}
async function publierMaj(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  if(!FB){ toast('La publication en ligne nécessite la synchronisation'); return; }
  let html; try{ html=await file.text(); }catch(e){ toast('Fichier illisible'); return; }
  const m=html.match(/const VERSION_APP='([\d.]+)'/);
  if(!m||!html.includes('Gestion de données SNI Express')||html.length<50000){ toast('Ce fichier n’est pas une version de Gestion SNI Express'); return; }
  if(!confirm('Publier la version '+m[1]+' pour tous les appareils ?\n\nÀ leur prochaine ouverture, ils verront « Nouvelle version disponible ».')) return;
  if(!await confirmerAdmin('publier la version '+m[1])) return;
  toast('Publication de la version '+m[1]+'…');
  try{ const T=400000, n=Math.ceil(html.length/T);
    for(let k=0;k<n;k++) await BASE.collection('maj').doc('p'+k).set({t:html.slice(k*T,(k+1)*T)});
    await BASE.collection('maj').doc('info').set({version:m[1],parts:n,date:new Date().toISOString(),par:(USER&&USER.nom)||''});
    MAJ_EN_LIGNE={version:m[1],parts:n,date:new Date().toISOString(),par:(USER&&USER.nom)||''};
    journal('Mise à jour publiée en ligne : version '+m[1]); toast('Version '+m[1]+' publiée pour tous les appareils'); render();
  }catch(e){ toast('Échec de la publication : '+(e.message||e)); }
}
async function installerMajEnLigne(){
  try{ toast('Téléchargement de la version '+MAJ_EN_LIGNE.version+'…');
    if(MAJ_EN_LIGNE.gh&&NATIF) return await majTelephone(MAJ_EN_LIGNE);
    const html=MAJ_EN_LIGNE.gh?await majGitHubHtml(MAJ_EN_LIGNE):await telechargerMajEnLigne();
    if(estWindows()) return installerHtml(html);
    await saveFile('Gestion de données SNI Express '+MAJ_EN_LIGNE.version+'.html', new Blob([html],{type:'text/html'}));
    toast('Nouvelle version téléchargée : remplacez l’ancien fichier par celui-ci');
  }catch(e){ toast('Échec du téléchargement : '+(e.message||e)); }
}
/* Fenêtre « Mise à jour » ouverte depuis l'écran d'ouverture ou les Paramètres */

        ${NATIF&&!MAJ_EN_LIGNE.gh?`<p>Sur le téléphone, la mise à jour s’installe avec le nouveau fichier APK (vos données sont conservées). Demandez-le au créateur du logiciel : ${contact}.</p>`
          :`<div class="btns" style="margin-bottom:1rem"><button class="btn pri" onclick="installerMajEnLigne()">${estWindows()||NATIF?'Installer la version '+h(v)+' maintenant':'Télécharger la version '+h(v)}</button></div>`}`
      :`<p class="errs ok" style="margin:0 0 1rem"><b>Le logiciel est à jour.</b></p>`)+`<div class="btns" style="margin-bottom:1rem"><button class="btn" onclick="ouvrirMaj(true)">Vérifier à nouveau</button></div>`
     :`<p class="muted">La vérification en ligne des nouvelles versions s’activera avec la synchronisation en ligne.</p>`}
    ${estWindows()?`<p style="margin-bottom:.4rem"><b>Installer depuis un fichier</b> (nouveau fichier « Gestion de données SNI Express.html ») – code administrateur demandé, données conservées :</p>
      <div class="btns"><label class="btn${dispo?'':' pri'}">Choisir le fichier de mise à jour<input type="file" accept=".html,.htm,text/html" style="display:none" onchange="installerMaj(this)"></label></div>`
     :NATIF&&MAJ_GH?`<p class="muted" style="margin-bottom:0">Les nouvelles versions s’installent toutes seules à l’ouverture de l’application, dès qu’Internet est disponible (vos données sont conservées).</p>`
     :NATIF?`<p class="muted" style="margin-bottom:0">Pour mettre à jour l’application : installez le nouvel APK par-dessus l’ancien (vos données sont conservées). Contact : ${contact}.</p>`
     :`<p class="muted" style="margin-bottom:0">Version navigateur : remplacez ce fichier .html par la nouvelle version, au même endroit, puis rouvrez-le avec le même navigateur. Vos données sont conservées.</p>`}`);
}
/* Sauvegarde complète de toutes les données (factures, charges, employés, PDG, paramètres, images) */
const SAUV_APP='gestion-sni', SAUV_EXCLUS=['comptes','connexionOff','adminSeul','connOffV','verrou'];
const sauvegardeCard=()=>`<div class="card"><h2>Sauvegarde complète</h2><p class="muted" style="margin-top:0">Téléchargez un fichier qui contient toutes les données : factures, reçus, charges, employés et bulletins, compte du PDG, paramètres, logo et cachet. Gardez-le sur une clé USB ou envoyez-le-vous par e-mail. Faites-le au moins une fois par semaine.</p>
  <div class="btns"><button class="btn pri" onclick="sauvegarder()">Télécharger la sauvegarde complète</button><label class="btn">Restaurer une sauvegarde<input type="file" accept=".json,application/json" style="display:none" onchange="restaurerTout(this)"></label></div>
  <p class="muted" style="margin-bottom:0">${S.derniereSauv?'Dernière sauvegarde : '+dt(S.derniereSauv)+'.':'<span style="color:var(--unpaid)">Aucune sauvegarde complète faite pour le moment.</span>'} Les comptes et les codes secrets ne sont jamais remplacés par une restauration.</p></div>`;
async function sauvegarder(){
  const o={app:SAUV_APP,version:1,date:new Date().toISOString(),settings:{...S,comptes:undefined},images:IMG,factures:FAC,charges:CHG,employes:EMP,pdg:PDG};
  await saveFile('sauvegarde-sni-'+auj()+'.json', new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
  S.derniereSauv=o.date; try{ await saveSettings(); }catch(e){}
  journal('Sauvegarde complète téléchargée'); toast('Sauvegarde complète téléchargée'); if(view==='param') render();
}
async function restaurerTout(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  let o; try{ o=JSON.parse(await file.text()); }catch(e){ toast('Fichier de sauvegarde illisible'); return; }
  // Ancien format des sauvegardes du logiciel Windows (version 2.0.x)
  if(o&&o.app==='facturation-sni') o={app:SAUV_APP,date:o.date,settings:o.S,images:o.IMG,factures:o.FAC,charges:o.CHG,employes:o.EMP,pdg:o.PDG};
  if(!o||o.app!==SAUV_APP){ toast('Ce fichier n’est pas une sauvegarde complète du logiciel'); return; }
  const L=k=>Array.isArray(o[k])?o[k].filter(x=>x&&x.id):[];
  if(!confirm(`Restaurer la sauvegarde du ${dt(o.date)} ?\n\n${L('factures').length} facture(s), ${L('charges').length} charge(s), ${L('employes').length} employé(s), ${L('pdg').length} transaction(s) du PDG.\n\nLes éléments identiques seront remplacés, les autres conservés.`)) return;
  if(!await confirmerAdmin('restaurer une sauvegarde complète')) return;
  try{
    for(const k of ['factures','charges','employes','pdg']) await putMany(k,L(k));
    if(o.settings&&typeof o.settings==='object') Object.keys(o.settings).forEach(k=>{ if(!SAUV_EXCLUS.includes(k)) S[k]=o.settings[k]; });
    if(o.images&&typeof o.images==='object') Object.assign(IMG,o.images);
    await saveSettings();
  }catch(e){ toast('Restauration interrompue, réessayez'); return; }

async function connexion(){
  const B=lireBlocage(); bloqueJusqu=Math.max(bloqueJusqu,B.jusqu||0); essais=Math.max(essais,B.essais||0);
  if(Date.now()<bloqueJusqu){ const s=Math.ceil((bloqueJusqu-Date.now())/1000); toast('Trop d’essais : patientez '+(s>90?Math.ceil(s/60)+' minutes':s+' secondes')); return; }
  const t=val('lg_u').trim(), p=val('lg_p'); if(!t||!p){ toast('Tapez votre identifiant et votre mot de passe'); return; }
  const c=trouverCompte(t)||{id:'?',nom:t,pin:'-'};
  if(await hashPin(c.id,p)!==c.pin){ essais++; journal('Code incorrect',c.nom);
    if(essais>=5){ const n=(B.series||0)+1, att=Math.min(30000*Math.pow(2,n-1),3600000); bloqueJusqu=Date.now()+att; essais=0; ecrireBlocage({jusqu:bloqueJusqu,essais:0,series:n}); journal('Accès bloqué '+Math.round(att/1000)+' s après 5 codes faux',c.nom); toast('Code incorrect 5 fois : accès bloqué '+(att>=60000?Math.round(att/60000)+' minute(s)':Math.round(att/1000)+' secondes')); }
    else { ecrireBlocage({...B,essais}); toast('Code incorrect ('+essais+'/5)'); }
    document.getElementById('lg_p').value=''; return; }
  if(c.attente){ journal('Accès refusé : inscription pas encore validée',c.nom); toast('Votre inscription attend la validation du créateur du logiciel'); document.getElementById('lg_p').value=''; return; }
  if(adminSeul()&&!estAdmin(c)){ journal('Accès refusé : compte non administrateur',c.nom); toast('Accès réservé à l’administrateur'); document.getElementById('lg_p').value=''; return; }
  essais=0; ecrireBlocage({}); journal('Connexion',c.nom); derniereAct=Date.now(); USER=c; LOCKED=false; impPar=c.nom; try{ sessionStorage.setItem('sni_user',c.id); }catch(e){} signalerAppareil(true);
  view='menu'; drawNav(); render(); toast('Connexion réussie');
}

/* Dépenses par type */
function rubrique(c){ if(c.cat) return c.cat; const t=normT(c.note);
  if(c.type==='electricite') return 'Électricité'; if(c.type==='salaire') return 'Salaires';
  if(/internet|wifi|connexion|forfait/.test(t)) return 'Internet'; if(/loyer/.test(t)) return 'Loyer'; if(/\beau\b/.test(t)) return 'Eau';
  if(/papier|rame|carton|bobine/.test(t)) return 'Papier'; if(/encre|toner|cartouche/.test(t)) return 'Encre';
  if(/transport|taxi|carburant|essence|gasoil|livraison|fret/.test(t)) return 'Transport';
  return c.type==='autre'?'Autres charges fixes':'Autres dépenses variables'; }
function depensesCard(st,titre){
  const G={}; st.cs.forEach(c=>{ const r=rubrique(c); G[r]=G[r]||{n:0,t:0}; G[r].n++; G[r].t+=n0(c.montant); });
  const L=Object.entries(G).sort((a,b)=>b[1].t-a[1].t), tot=st.totCh;
  return `<div class="card"><h2>Dépenses par type – ${titre}</h2>${L.length?`<div class="scroll"><table><thead><tr><th>Type de dépense</th><th class="r">Nombre</th><th class="r">Total</th><th class="r">Part</th></tr></thead><tbody>
    ${L.map(([r,x])=>`<tr><td>${h(r)}</td><td class="r">${x.n}</td><td class="r num">${money(x.t)}</td><td class="r num">${tot?Math.round(x.t/tot*100):0} %</td></tr>`).join('')}
    <tr><td><b>Total des dépenses</b></td><td class="r"><b>${st.cs.length}</b></td><td class="r num"><b>${money(tot)}</b></td><td class="r num"><b>100 %</b></td></tr></tbody></table></div>
    <p class="muted" style="margin-bottom:0">Soit ${eur(tot)} – ${h(enLettres(tot))}.</p>`:'<div class="empty">Aucune dépense sur cette période.</div>'}</div>`;
}

/* ============ Connexion Internet obligatoire à l'ouverture ============ */
/* navigator.onLine ne suffit pas (il dit « en ligne » sur un réseau sans Internet) : on contacte réellement deux serveurs */
function joindre(url,ms){
  return new Promise((ok,ko)=>{ const t=setTimeout(()=>ko(new Error('délai')),ms);
    fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(()=>{ clearTimeout(t); ok(true); },e=>{ clearTimeout(t); ko(e); }); });
}
async function internetOk(){
  if(navigator.onLine===false) return false;
  try{ await Promise.any([joindre('https://www.google.com/generate_204',7000),joindre('https://1.1.1.1/cdn-cgi/trace',7000)]); return true; }catch(e){ return false; }
}
